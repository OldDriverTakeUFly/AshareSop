# Logrotate config for invest_sop cron job logs
# Install: sudo cp this file to /etc/logrotate.d/invest_sop
#          (logrotate runs daily via /etc/cron.daily/logrotate by default)
#
# Rotates logs when they exceed 10MB, keeps 5 archives, compresses old ones.

/home/leo/Projects/CodeAgentDashboard/stockhot/invest_sop/logs/*.log {
    size 10M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
